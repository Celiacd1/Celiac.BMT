<!DOCTYPE html>
  <html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>مساعد السلياك</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        <h2>مساعد السلياك 🌾</h2>
        <p>اسألني عن مرض السلياك والغلوتين</p>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">
          <div class="message-bubble">
            مرحباً! أنا مساعدك الخاص بمرض السلياك. كيف يمكنني مساعدتك اليوم؟ 😊
          </div>
        </div>
      </div>
      <div class="chat-input">
        <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." />
        <button id="sendBtn" onclick="sendMessage()">إرسال</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
  </html>
